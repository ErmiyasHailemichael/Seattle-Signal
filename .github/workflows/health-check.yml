name: Health Check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/health-check.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HEALTH_CHECK_URL: https://seattle-signal.vercel.app/api/health
